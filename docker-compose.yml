services:
  postgres:
    image: postgres:16-alpine
    container_name: exploration-drone-db
    environment:
      POSTGRES_DB: exploration_drone_db
      POSTGRES_USER: hiccup
      POSTGRES_PASSWORD: hiccup123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: